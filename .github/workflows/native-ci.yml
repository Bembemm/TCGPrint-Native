name: native-ci

on:
  push:
    branches:
      - main
      - "native/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / GCC / Qt 6.11.2
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.2"
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release --parallel

      - name: Test
        run: ctest --preset ci-release

      - name: Core benchmark smoke
        run: ./build/ci-release/tcgprint_benchmarks -iterations 1

  windows:
    name: Windows / MSVC 2022 / Qt 6.10.0
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-release

      - name: Build
        shell: pwsh
        run: cmake --build --preset windows-release --parallel

      - name: Test
        shell: pwsh
        run: ctest --preset windows-release

      - name: Core benchmark smoke
        shell: pwsh
        run: .\build\windows-release\tcgprint_benchmarks.exe -iterations 1

      - name: Package portable application
        shell: pwsh
        run: .\scripts\package-windows.ps1 -BuildDirectory "build/windows-release" -OutputDirectory "artifacts/TCGPrint-Native-win64"

      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: TCGPrint-Native-win64
          path: artifacts/TCGPrint-Native-win64
          if-no-files-found: error
